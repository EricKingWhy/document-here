<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyVault</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b;
  --line:#e8e8ed; --accent:#0071e3; --green:#30d158; --red:#ff3b30; --orange:#ff9f0a;
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:48px 24px 80px}
header{margin-bottom:36px}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em}
header p{color:var(--fg2);font-size:15px;margin-top:6px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.search{flex:1;max-width:320px}
input,select{font:inherit;font-size:14px;color:var(--fg);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:9px 14px;outline:none;transition:border .15s, box-shadow .15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
button{font:inherit;font-size:14px;font-weight:500;border:none;border-radius:10px;padding:9px 18px;
  cursor:pointer;transition:filter .15s, transform .05s}
button:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-ghost:hover{background:rgba(0,113,227,.08)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.dot{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;font-weight:600;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:600}
.sub{font-size:12px;color:var(--fg3);margin-top:2px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.bal{text-align:right;font-size:14px;font-weight:600}
.bal .detail{font-size:11px;color:var(--fg3);font-weight:400;margin-top:2px}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:1px}
.badge.ok{background:rgba(48,209,88,.14);color:#1d9a43}
.badge.low{background:rgba(255,159,10,.16);color:#c77700}
.badge.invalid,.badge.error{background:rgba(255,59,48,.12);color:var(--red)}
.actions{display:flex;gap:4px}
.icon-btn{padding:6px 10px;font-size:13px;color:var(--fg2);border-radius:8px}
.icon-btn:hover{background:var(--bg);color:var(--fg)}
.empty{text-align:center;color:var(--fg3);padding:64px 20px;font-size:15px}
.empty .big{font-size:40px;margin-bottom:12px;opacity:.4}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:18px;padding:28px;width:min(92vw,420px);box-shadow:0 24px 64px rgba(0,0,0,.24)}
.modal h2{font-size:19px;margin-bottom:20px;letter-spacing:-.01em}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--fg2);margin-bottom:6px;text-transform:none}
.field input,.field select{width:100%}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,80px);background:var(--fg);color:#fff;
  font-size:13px;padding:10px 20px;border-radius:20px;opacity:0;transition:.25s;z-index:20}
.toast.show{transform:translate(-50%,0);opacity:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--fg3);border-top-color:transparent;
  border-radius:50%;animation:s .7s linear infinite;vertical-align:-1px;margin-right:5px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>KeyVault</h1>
    <p>各厂商 API Key 统一管理与额度查询 · 数据加密保存在本地</p>
  </header>
  <div class="toolbar">
    <input class="search" id="q" placeholder="搜索名称或厂商…">
    <button class="btn-primary" onclick="openAdd()">＋ 添加 Key</button>
  </div>
  <div class="card" id="list"></div>
</div>

<div class="overlay" id="ov">
  <div class="modal">
    <h2 id="mTitle">添加 API Key</h2>
    <div class="field"><label>名称</label><input id="fName" placeholder="例：主力 DeepSeek"></div>
    <div class="field"><label>厂商</label><select id="fProv" onchange="provChanged()"></select></div>
    <div class="field" id="baseField" style="display:none"><label>Base URL（OpenAI 兼容接口）</label>
      <input id="fBase" placeholder="https://api.xiaomimimo.com/v1"></div>
    <div class="field"><label>API Key</label><input id="fKey" placeholder="sk-…" autocomplete="off"></div>
    <div class="foot">
      <button class="btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveKey()">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PROVIDERS = {
  deepseek:{label:"DeepSeek",color:"#4D6BFE",check:"balance"},
  moonshot:{label:"Moonshot / Kimi",color:"#111827",check:"balance"},
  openrouter:{label:"OpenRouter",color:"#6467F2",check:"balance"},
  together:{label:"Together AI",color:"#0F6FFF",check:"balance"},
  openai:{label:"OpenAI",color:"#10A37F",check:"balance"},
  cline:{label:"Cline",color:"#3B82F6",check:"none",console:"https://app.cline.bot/credits"},
  mimo:{label:"小米 MiMo",color:"#FF6900",check:"validate",base:"https://api.xiaomimimo.com/v1"},
  zhipu:{label:"智谱 GLM",color:"#3859FF",check:"none",console:"https://open.bigmodel.cn"},
  siliconflow:{label:"SiliconFlow",color:"#7C3AED",check:"none",console:"https://cloud.siliconflow.cn"},
  custom:{label:"自定义 / 其他",color:"#8E8E93",check:"validate"}
};
let keys = [], editingId = null;

const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, body){
  const r = await fetch("/api/"+path, body!==undefined
    ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})}
    : undefined);
  return r.json();
}

async function load(){
  keys = (await api("keys")).keys || [];
  render();
}

function render(){
  const q = $("#q").value.trim().toLowerCase();
  const list = keys.filter(k => !q || k.name.toLowerCase().includes(q) || (PROVIDERS[k.provider]?.label||"").toLowerCase().includes(q));
  const el = $("#list");
  if(!list.length){
    el.innerHTML = `<div class="empty"><div class="big">⌘</div>${keys.length?"没有匹配的 Key":"还没有保存任何 Key<br>点击右上角「＋ 添加 Key」开始"}</div>`;
    return;
  }
  el.innerHTML = list.map(k=>{
    const p = PROVIDERS[k.provider]||PROVIDERS.custom;
    const st = k.lastStatus;
    const badge = st ? `<span class="badge ${st.status}">${
      st.status==="ok"?"正常":st.status==="low"?"余额不足":st.status==="invalid"?"无效":"错误"}</span>` : "";
    const bal = st ? `<div class="bal">${esc(st.text)}${badge}
      ${st.detail?`<div class="detail">${esc(st.detail)}</div>`:""}</div>`
      : `<div class="bal" style="color:var(--fg3)">未查询</div>`;
    return `<div class="row">
      <div class="dot" style="background:${p.color}">${esc(p.label[0])}</div>
      <div class="info"><div class="name">${esc(k.name)} · ${esc(p.label)}</div>
        <div class="sub">${esc(k.key)}</div></div>
      ${bal}
      <div class="actions">
        <button class="icon-btn" title="查询额度" onclick="checkKey('${k.id}')">⟳</button>
        <button class="icon-btn" title="查看完整 Key" onclick="reveal('${k.id}',this)">👁</button>
        <button class="icon-btn" title="编辑" onclick="openEdit('${k.id}')">✎</button>
        <button class="icon-btn" title="删除" onclick="delKey('${k.id}')">🗑</button>
      </div></div>`;
  }).join("");
}

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}

async function checkKey(id){
  const item = keys.find(k=>k.id===id);
  item.lastStatus = {status:"ok", text:"查询中…"};
  render();
  item.lastStatus = await api("check",{id});
  if(item.lastStatus.status==="unsupported" && PROVIDERS[item.provider]?.console)
    item.lastStatus.detail = (item.lastStatus.detail||"") + " " + PROVIDERS[item.provider].console;
  render();
}

async function reveal(id, btn){
  const r = await api("reveal",{id});
  const item = keys.find(k=>k.id===id);
  item.key = r.key; render();
  setTimeout(()=>{item.key = maskKey(r.key); render();}, 15000);  // 15 秒后自动隐藏
}
function maskKey(k){ return k && k.length>12 ? k.slice(0,6)+"••••••••"+k.slice(-4) : "•".repeat((k||"").length||8); }

function openAdd(){
  editingId=null; $("#mTitle").textContent="添加 API Key";
  $("#fName").value=""; $("#fKey").value=""; $("#fBase").value="";
  $("#fProv").value="deepseek"; provChanged(); $("#ov").classList.add("open");
}
function openEdit(id){
  const k = keys.find(x=>x.id===id); if(!k) return;
  editingId=id; $("#mTitle").textContent="编辑 Key";
  $("#fName").value=k.name; $("#fProv").value=k.provider; $("#fKey").value="（留空则不修改）";
  $("#fBase").value=k.base_url||""; provChanged(); $("#ov").classList.add("open");
}
function provChanged(){
  const p = PROVIDERS[$("#fProv").value];
  $("#baseField").style.display = (p.check==="validate" && !$("#fBase").value && p.base) ? "block" :
    (p.check==="validate" ? "block" : "none");
  if(p.base && !$("#fBase").value) $("#fBase").value = p.base;
}
function closeModal(){ $("#ov").classList.remove("open"); }

async function saveKey(){
  const name=$("#fName").value.trim(), key=$("#fKey").value.trim(), base=$("#fBase").value.trim();
  if(!name) return toast("请填写名称");
  if(!editingId && !key) return toast("请填写 API Key");
  await api("keys",{id:editingId||undefined, name, provider:$("#fProv").value,
    key: (key && !key.startsWith("（留空")) ? key : undefined, base_url:base});
  closeModal(); toast(editingId?"已保存":"已添加"); load();
}

async function delKey(id){
  const k = keys.find(x=>x.id===id);
  if(!confirm(`确定删除「${k.name}」？此操作不可恢复。`)) return;
  await api("keys/delete",{id}); toast("已删除"); load();
}

// 初始化
$("#fProv").innerHTML = Object.entries(PROVIDERS).map(([id,p])=>`<option value="${id}">${p.label}</option>`).join("");
$("#q").addEventListener("input", render);
$("#ov").addEventListener("click", e=>{ if(e.target===e.currentTarget) closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
load();
</script>
</body>
</html>
